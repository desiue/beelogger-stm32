; PlatformIO Project Configuration for BeeLogger STM32
; Supports both BluePill (STM32F103) and BlackPill (STM32F401/F411)

; Gilt für alle Boards. Bibliotheken liegen in lib/ (beelogger_arduino_libs_2026_04 von beelogger.de).
; Firmware verlangt STM32-Core 2.6.0 (= framework-arduinoststm32 4.20600).
[env]
platform_packages =
    platformio/framework-arduinoststm32@~4.20600.0
    platformio/framework-cmsis@~2.50900.0
; CMSIS-DSP wird nicht benutzt, das PIO-Paket CMSIS 5.9 hat die vorkompilierte Lib nicht
build_unflags = -larm_cortexM4lf_math -larm_cortexM3l_math

[env:bluepill_f103c8]
platform = ststm32@^17
board = bluepill_f103c8_128k
; Firmware braucht 128 KB (F103CB); Board-Define wie Arduino-IDE "BluePill F103CB"
board_build.extra_flags = -DSTM32F1 -DSTM32F103xB -DARDUINO_BLUEPILL_F103CB
framework = arduino
upload_protocol = stm32cubeprogrammer
upload_port = COM5
; Arduino IDE equivalent settings:
; Board: "Generic STM32F1 series"
; Board Part Number: "BluePill F103C8" or "BluePill F103CB (or C8 with 128k)"
; USART support: "Enabled generic serial"
; USB support: "None"
; Optimize: "Smallest"
; C Runtime Lib: "NewLib Nano default"
; Upload method: "STM32CubeProgrammer Serial"

; Compiler flags for smallest code (matching Arduino IDE "Optimize: smallest")
build_flags = 
    -Os
    -flto
    -ffunction-sections
    -fdata-sections
    -specs=nano.specs
    -DARDUINO_ARCH_STM32
    -I$PROJECT_DIR    ; damit "src/lmic_otaa/..." wie in der Arduino IDE gefunden wird
    -DSTM32F1

; Monitor settings for debug output
monitor_speed = 9600
monitor_filters = esp32_exception_decoder

[env:blackpill_f411ce]
platform = ststm32@^17
board = blackpill_f411ce
framework = arduino
upload_protocol = serial
upload_port = /dev/ttyUSB0
; Arduino IDE equivalent settings:
; Board: "Generic STM32F4 series"
; Board Part Number: "BlackPill F411CE" or "BlackPill F401CC"
; USART support: "Enabled generic serial"
; USB support: "None"
; Optimize: "Smallest"
; C Runtime Lib: "NewLib Nano default"
; Upload method: "STM32CubeProgrammer Serial"

build_flags = 
    -Os
    -flto
    -ffunction-sections
    -fdata-sections
    -specs=nano.specs
    -DARDUINO_ARCH_STM32
    -I$PROJECT_DIR    ; damit "src/lmic_otaa/..." wie in der Arduino IDE gefunden wird
    -DSTM32F4

monitor_speed = 9600
monitor_filters = esp32_exception_decoder

[env:blackpill_f401cc]
platform = ststm32@^17
board = blackpill_f401cc
framework = arduino
upload_protocol = stm32cubeprogrammer
upload_port = COM5
build_flags = 
    -Os
    -flto
    -ffunction-sections
    -fdata-sections
    -specs=nano.specs
    -DARDUINO_ARCH_STM32
    -I$PROJECT_DIR    ; damit "src/lmic_otaa/..." wie in der Arduino IDE gefunden wird
    -DSTM32F4
monitor_speed = 9600

; Common settings for all environments
[platformio]
default_envs = bluepill_f103c8

; Disable library auto-update (matching Arduino IDE setting)
disable_lib_auto_update = true
