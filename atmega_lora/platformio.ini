; Nur zum Prüfen, ob der ATmega-LoRa-Sketch baut und in den Speicher passt.
; Aufspielen wie gewohnt mit der Arduino IDE (Ordner beelogger_LORA_261107 öffnen).
; Bibliotheken: Original 2026_04 (LMIC unverändert, DISABLE_JOIN gesetzt).
[platformio]
src_dir = beelogger_LORA_261107

[env]
platform = atmelavr
framework = arduino
lib_extra_dirs = ../orginal_firmware_bibliotheken/beelogger_arduino_libs_2026_04

; beeloggerSMD: Pro Mini 3,3 V 8 MHz
[env:promini8]
board = pro8MHzatmega328

; Universal 1.x: Pro Mini 5 V 16 MHz
[env:promini16]
board = pro16MHzatmega328

; Universal 1.x: Nano 5 V 16 MHz
[env:nano]
board = nanoatmega328
